<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title>Sensor Dashboard</title>
        <link rel="stylesheet" href="style.css"/>
    </head>
    <body>
        <header class="header">
            <div class="header-content">
                <span class="icon">🪴</span>
                <h1>Greener Pastures</h1>
            </div>
            <div class="header-status">
                Active Logs: <span id="queue-count" class="badge-count">0</span>
            </div>
        </header>
    </body>

    <main class="contianer">
        <aside class="form-panel">
            <h2 class="panel-title">Record Sensor Output</h2>

            <form action="#" id="sensor-form" novalidate>
                <div class="form-group">
                    <label for="sensor-number" class="form-label">Sensor number<span class="required">*</span></label>
                    <input
                    type="number"
                    name="sensor-number"
                    id="sensor-number"
                    class="form-control"
                    placeholder="e.g. 6742341"
                    required
                    />
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="ph-level" class="form-label">Enter pH Level<span class="required">*</span></label>
                        <input
                        type="number"
                        name="ph-level"
                        id="ph-level"
                        class="form-control"
                        min="0"
                        max="14"
                        placeholder="7"
                        required
                        />
                    </div>
                    <div class="form-group">
                        <label for="tempurature" class="form-label">Tempurature (F)<span class="required">*</span></label>
                        <input
                        type="number"
                        name="tempurature"
                        id="tempurature"
                        class="form-control"
                        placeholder="75"
                        required
                        />
                    </div>
                    <div class="form-group">
                        <label for="electrical" class="form-label">Electrical Conductivity (mS/cm)<span class="required">*</span></label>
                        <input
                        type="number"
                        name="electrical"
                        id="tempurature"
                        class="form-control"
                        placeholder="1.5"
                        required
                        />
                    </div>
                    <div class="form-group">
                        <label for="humidity" class="form-label">Humidity %<span class="required">*</span></label>
                        <input
                        type="number"
                        name="humidity"
                        id="humidity"
                        class="form-control"
                        placeholder="60"
                        required
                        />
                    </div>
                    <button type="submit" id="btn-submit" class="btn btn-primary">Log Sensor Data</button>
                </div>
            </form>
        </aside>

        <section class="panel">
        <div class="log-header">
          <h2 class="panel-title">Previous Logs</h2>
          <button id="btn-clear-all" class="btn btn-outline-danger btn-sm">
            Purge Logs
          </button>
        </div>

        <div id="empty-state" class="empty-state">
          <p>No previous log activity saved.</p>
        </div>

        <ul id="log-list" class="log-grid" aria-live="polite"></ul>
      </section>

    </main>
    <footer class="portal-footer">
      <p>&copy; 2026 CSI 3150 Assignment 2B
      </p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
